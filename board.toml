# peridot (Redmi Turbo 3 / POCO F6) - UniXNU device repository, format 2.
#
# Every value below is either taken from a named source or marked TODO(verify).
# Sources: stock DTS (dts/vendor/peridot-stock.dts), Mu-Silicium
# Platforms/Xiaomi/peridotPkg (peridot.dsc, Library/MemoryMapLib),
# Resources/Configs/peridot.toml, and on-device getprop.
schema_version = 2

[board]
name = "peridot"
soc = "SM8635"
soc_source = "sm8635"
description = "Redmi Turbo 3 / POCO F6"
kit = "peridot"
os_profile = "ipados-17.7.11-21H461"

# ArmDTPlatform and ArmCpu come from the ARM64 profile. DarwinBoot and
# XnuPrelink are required to boot. Storage, display and input components are
# added once their board recipes exist; see the porting record for the order.
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "ShengUfs", "Adreno735"]

[kernel]
defconfig = "peridot_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8635.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# The arm64 profile lists these explicitly, and an explicit list disables the
# automatic addition of every selected component that has a build step, so the
# storage components have to be named here too. Keep this equal to
# profiles/arch/arm64/profile.toml plus the two storage additions; VirtioMmioBlock
# comes first because ShengUfs depends on it.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "component:VirtioMmioBlock",
  "component:ShengUfs",
  "build-ufs-bindings.py",
  "component:Adreno735",
  "build-adreno735-kits.py",
  "build-sheng-platform-power.py",
]

# [kernel.prelink] is inherited from the OS profile: the iPadOS 17.7.11
# kernelcache pin, slide, early_security_init address and roots list all belong
# to that image, not to this board. Do not override them here.

[device_tree]
source = "device:dts/peridot.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "peridot"
dsc = "Platforms/Xiaomi/peridotPkg/peridot.dsc"
fd = "Build/peridotPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "peridot"
ENABLE_SECUREBOOT = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"

[payload]
volume = "PERIDOT"
# StaticTrustCache (v2, 2478) + RestoreTrustCache converted from v1 (267 entries):
# DarwinBoot copies the bundle to /chosen/memory-map/TrustCache for AMFI.
trust_cache_sha256 = ["32462f52946f5f53953c1fa0a679241eddb1226c9ecdfd318f9bea24836d860d"]
# 64 MiB: the APFS root bring-up (probe 18) reads the 184 MB container from the start of
# the userdata partition instead of shipping it in the payload, so the volume only has to
# hold kernel.macho (51 MB) + ADT + a small Data seed. It must also stay under the 96 MiB
# boot-image ramdisk limit the bootloader enforces (96 MiB boots, 128 MiB is refused).
size_mib = 64
loader = "firmware"
title = "UniXNU (peridot)"
# The panic screen and the entry probe share the kernel's padding, and together
# they do not fit (the panic blob alone is 0xa2f bytes). While locating the
# handoff stall, keep the probe and drop the panic screen.
panic_screen = false
# Bisection with the entry probe (a timed PSCI reset after a named call) put the
# stall in the CPU topology parser; MAX_CPUS 8 / MAX_CPU_CLUSTERS 2 fixed it.
# The probe now sits at the next frontier: arm_vm_init, which never returned
# before that fix.
dram_size = "0x80000000"

# Storage bring-up and the current root path (2026-11-15; evidence in
# peridot/notes-2026-11-15-real-root.md and peridot/HANDOFF-2026-11-15-real-root.md):
# native-ufs-probe=18 brings the UFS transport up, reads the 184,549,376-byte APFS
# RestoreRamDisk container from userdata offset 0 into wired memory, registers it as md1 and
# leaves it as rootdev; then it publishes the same window as a writable IOBlockStorageDevice
# (disk0/disk1/disk1s1). rd=md1 plus patches/xnu/peridot-rd-wait.patch make IOFindBSDRoot wait
# for that device so APFS mounts the container through the restore/ramdisk branch of
# container_rootmount. md0 stays occupied by the payload Data seed, so the container lands on
# md1: the payload carries a zero seed, never an executable one (an executable seed lets
# mockfs produce a fake root that looks like success - p343/p353).
# offline-apfs-load=1 loads com.apple.filesystems.apfs before mountroot because the prelinked
# kext does not register its vfs at prelink time (upstream UniXNU patch
# UniXNU/patches/xnu/offline-component-load-probes.patch); peridot-apfs-register.patch
# re-registers it from vfs_subr.c and moves it in front of mockfs.
# peridot-allow-unsigned-root=1 is the bring-up opt-out of the exec/rootauth policy: the
# RestoreRamDisk volume has no seal and its role-less container cannot pass
# FSIOC_KERNEL_ROOTAUTH. amfi_* flags and -restore are AMFI/restore-mode switches. All of
# these are bring-up only; see peridot/audit/2026-11-15-code-audit.md P1-7 before shipping
# this configuration anywhere.
# native-ufs-mountroot=1 (not used in this profile) would run vfs_mountroot() on the bdevsw
# window once the block-device ioctls answer; probes 20/21/22 and 30-33 are diagnostics.
kernel_args = ["-v", "native-ufs-probe=18", "sheng-pmgr=2", "amfi_get_out_of_my_way=1", "peridot-allow-unsigned-root=1", "offline-apfs-load=1", "rd=md1", "amfi-allows-trust-cache-load=1", "amfi_allow_any_signature=1", "-restore"]

[payload.adt]
# TODO(verify): 32785 (0x8011) matches the iPadOS profile's impersonated
# platform (iPad7,1 / A10X). Keep it equal to ipsw.chip_id unless the ADT
# tool needs the host SoC id instead.
chip_id = "32785"
# Contiguous window DarwinBoot maps: 256 MiB to 8 GiB in 2 MiB steps.
owned_memory_size = "0x100000000"
# CPU MPIDR values read from the stock DTS: eight cores at 0x000..0x700.
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"
packed_data_ramdisk = false
# The volume UUID of the APFS container this board now roots from: the RestoreRamDisk of
# iPadOS 17.7.11 21H461 (restore-ramdisk.img), read with libfsapfs. The previous value was
# the Data update volume copied from the sheng board.
root_match_volume_uuid = "9071148B-B025-402D-AD7A-48464D8B5FFF"
unique_chip_id = "required"

# Persistent panic log: pexpert check_for_panic_log() maps /pram and keeps the last panic
# text in the /chosen window. The address is the stock ramoops carve-out, which is reserved
# DRAM and survives a warm reset (TODO(verify): confirm nothing else writes 0xa7000000).
[adt]

[adt.pram]
address = "0xa7000000"
size = "0x400000"

[adt.chosen.u32]
embedded-panic-log-size = "0x40000"

[userdata]
# TODO(REQUIRED): both values come from the GPT entry named "userdata" on this
# phone. Do not guess them: a wrong window writes outside the intended region.
#
# Measured on 2026-10-26 (fastboot getvar partition-size:userdata):
#   0x78587FB000 bytes = 126191611 LBAs at 4096 bytes. Use it to cross-check the
#   size of the GPT entry; last_lba - first_lba + 1 must equal this count.
# Also measured: max-download-size 768 MiB, partition-size:boot 96 MiB,
# partition-size:super 8.5 GiB, current-slot a, slot-count 2.
# Measured on 2026-11-02 by the driver (native-ufs-probe=10, root check): the GPT
# entry named "userdata" starts at LBA 0x253000. last_lba is derived from the
# partition size measured with `fastboot getvar partition-size:userdata`
# (0x78587FB000 bytes = 126191611 sectors at 4096), so
# last_lba - first_lba + 1 == 126191611 holds by construction.
first_lba = 0x253000
last_lba = 0x7AAB7FA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]

# The OS profile writes the iPad7,1 identity. Only board properties belong here.
[adt.buttons]
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"
[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]
[adt.buttons.u32]
home-button-type = 2

[adt.product.string]
# The GOP path is 8-bit; the profile defaults to P3 for the original panel.
artwork-display-gamut = "sRGB"

# Measured on the device: this bootloader rejects every signed-header variant
# with "Failed to load/authenticate boot image: Invalid Parameter" and accepts
# only the legacy layout. See docs/uefi-bringup.md.
#
# base, kernel_offset, ramdisk_offset and tags_offset keep the Mu-Silicium
# defaults the working image used; only the two keys below were decisive.
[bootimg.image]
header_version = 0
pagesize = 4096
