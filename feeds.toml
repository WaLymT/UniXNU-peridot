# Pinned shared support for this board.

[[source]]
name = "sm8635"
kind = "soc"
git = "https://github.com/OWNER/UniXNU-sm8635-common"
commit = "TODO-40-CHARACTER-COMMIT"

# ShengUfs is vendored under drivers/ShengUfs because peridot's UFS needs work
# the pinned upstream revision does not do yet: it matches qcom,sm8550-ufshc and
# reads SM8550 GCC offsets, while peridot is SM8635 / cliffs. A local source also
# keeps the build working when github.com is unreachable, which it often is here.
#
# When the port is done this should go back to a pinned git source so the board
# stays reproducible.

[[source]]
name = "ShengUfs"
kind = "driver"
local = "drivers/ShengUfs"

# Adreno735 is the peridot GPU driver skeleton: it calls the SM8635 platform kit
# and stops before the GMU. Vendored locally for the same reason as ShengUfs.
[[source]]
name = "Adreno735"
kind = "driver"
local = "drivers/Adreno735"
