[[area]]
id = "userspace"
status = "device-verified"
components = ["ShengUfs", "DarwinBoot"]
paths = ["configs/peridot_defconfig", "board.toml", "scripts/mockfs-launchd.S"]
inputs = ["mockfs (XNU's minimal executable-root filesystem), a Data ramdisk carrying a static arm64 Mach-O, and rd=md0."]
configuration = ["CONFIG_XNU_SOURCE_MOCKFS=y is the last mockfs line in configs/peridot_defconfig. xnu_env() takes the last value, and an earlier '# CONFIG_XNU_SOURCE_MOCKFS is not set' silently disabled the build (the vfs_conf.o marker stayed 0 and no mockfs symbol reached the kernel).", "board.toml sets kernel_args = -v rd=md0 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1, payload packed_data_ramdisk = false so the ADT publishes a plain RAMDisk, and no native-ufs-probe value so the UFS driver does not touch rootdev.", "The root device content is a static Mach-O built by tools/build-launchd.sh. tools/add-unixthread.py replaces LC_MAIN with LC_UNIXTHREAD because load_lcmain() marks LC_MAIN images as needing dyld, and clears MH_DYLDLINK/MH_PIE; tools/strip-dylinker.py rewrites the LC_LOAD_DYLINKER command as two LC_SOURCE_VERSION commands so no file offset moves.", "peridot-allow-unsigned-root=1 makes process_signature() treat the unsigned ramdisk executable as CS_SIGNED|CS_VALID; without it the MAC exec hook kills pid 1 with OS_REASON_EXEC/SECURITY_POLICY before any user code runs."]
procedure = ["bash peridot/tools/build-launchd.sh", "bash peridot/tools/build-ramdisk-root.sh pNNN (payload with --data-ramdisk, 64 MiB crop, mkbootimg)", "fastboot boot out/Mu-peridot-pNNN.img"]
findings = ["mockfs is the last vfs_mountroot candidate, so it only runs after APFS fails; it serves the root device as /sbin/launchd and provides the /dev mountpoint that devfs uses before init starts.", "An LC_MAIN image is rejected with needs_dynlinker (stage 13) before any user code runs; LC_UNIXTHREAD with sp=0 lets the kernel allocate the default stack and pass argc/argv.", "Console I/O is not allowed from the exception path: printf inside sleh_synchronous panics with 'Console I/O from interrupt-disabled context'. Record fault details in globals and print them from the panic text instead."]
completion = ["init executes a static arm64 image, its syscalls return correct results, and the output reaches the panel."]
limits = ["The static image has no libSystem or dyld, so it can only exercise raw syscalls and cannot host the real launchd.", "Running the real /sbin/launchd still needs an installed system volume with a valid code signature."]
evidence = [{ kind = "device", reference = "scripts/mockfs-launchd.S", command = "fastboot boot out/Mu-peridot-p131.img with kernel_args -v rd=md0 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1", revision = "283feb0deb1ed0c4909ff4e664f0113e3d9acbff", result = "The panel shows 'PERIDOT-USERSPACE pid=0x0000000000000001 fd=0x0000000000000000': init started from the mockfs root, getpid() returned 1, open(/dev/console) returned fd 0, write() reached the console, and the system stays up with no panic." }]
next_action = ["Keep the RAM-disk root as the bring-up vehicle while the installed-system path is unresolved.", "To run the real launchd, install iPadOS into the APFS container (RestoreRamDisk flow) or obtain a userdata image from a restored device."]
