schema_version = 1

[device]
name = "peridot"
soc = "SM8635"
os_profile = "ipados-17.7.11-21H461"
summary = "Redmi Turbo 3 / POCO F6 on Qualcomm SM8635 (cliffs). The board selects the iPadOS 17.7.11 profile and the SM8635 shared support. Every area starts as planned: the configuration exists, no build or hardware result has been recorded yet."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["SM8635 shared support, the iPadOS 17.7.11 profile, this board's defconfig and the pinned component sources."]
configuration = ["board.soc = SM8635; board.soc_source = sm8635; board.os_profile = ipados-17.7.11-21H461.", "The board selects only ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot; storage, display and input components are added when their board recipes exist."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig peridot_defconfig -D ../UniXNU-peridot from the UniXNU checkout.", "Run ./unixnu status --json -D ../UniXNU-peridot and review profiles, components, source pins and patch order."]
findings = ["Tables merge in ARM64, SoC, OS and device order. Arrays replace inherited selections, so every required component and fragment is listed explicitly.", "The board inherits [ipsw] and [kernel.prelink] from the OS profile. Overriding either in board.toml would desynchronise the kernelcache pin from the components it was qualified against."]
completion = ["All source pins resolve, status shows the intended component set and patch order, and the porting record check passes."]
limits = ["The SM8635 shared repository is new and unverified; its addresses are copied from the board's stock DTS."]
next_action = ["Resolve the SM8635 source pin and run status once the shared repository is published."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Board identity, profile selection, component list, firmware and payload inputs."

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["board.toml", "proprietary-files.txt", "package/", "docs/uefi-bringup.md"]
inputs = ["Mu-Silicium Platforms/Xiaomi/peridotPkg, its Resources/Configs/peridot.toml, the stock firmware DTB and the PSCI SMC interface."]
configuration = ["firmware.dsc = Platforms/Xiaomi/peridotPkg/peridot.dsc; firmware.config = peridot; firmware.fd = Build/peridotPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "The firmware DSC and FDF must embed UniXNU, UniXNUDxe, DarwinBoot, UniXNURamDiskDxe, DiskIoDxe and FAT support.", "bootimg.image pins header_version = 0 and pagesize = 4096; the device rejects every signed-header variant."]
procedure = ["Build the stock peridotPkg firmware first and boot it with fastboot boot to verify display, side buttons and block devices.", "Then run ./unixnu build firmware -D ../UniXNU-peridot --uefi ../Mu-Silicium and boot the resulting image."]
findings = ["peridotPkg already loads at 0xA7100000 with size 0x300000 and reports display, internal storage, side buttons, USB device mode and mass storage as working in the Mu-Silicium status page.", "Mu-Silicium labels peridot Inactive: the platform has no active maintainer, so any firmware fault has to be fixed here.", "Measured on the device: the RELEASE build produces a 3 MiB SILICIUM_UEFI.fd and the Silicium UEFI menu appears on the panel.", "Header v4, v4 with os_version and v1 are all rejected with Failed to load/authenticate boot image: Invalid Parameter; only header v0 with pagesize 4096 boots.", "With no bootable entry the menu returns to the bootloader after a while, and repeated failed fastboot boot attempts make the bootloader mark the active slot unbootable until fastboot --set-active clears it."]
completion = ["The firmware boots, shows the UniXNU menu, publishes the payload RAM disk and hands the framebuffer to DarwinBoot."]
limits = ["The peridot firmware configuration is unmaintained upstream; SM8635 and SM7675 share the Palawan platform package.", "The firmware volume has no bootable entry yet, so the menu is the end of the current chain."]
next_action = ["Add UniXNU, DarwinBoot and UniXNURamDiskDxe to the firmware volume so the menu has a boot option."]

[[area.evidence]]
kind = "source"
reference = "https://github.com/Project-Silicium/Mu-Silicium/blob/main/Platforms/Xiaomi/peridotPkg/peridot.dsc"
result = "FD base and size, framebuffer geometry, SM8635 platform selection."

[[area.evidence]]
kind = "device"
reference = "docs/uefi-bringup.md"
result = "Silicium UEFI menu appears on the panel when booted with header v0 and pagesize 4096."
command = "fastboot boot Mu-peridot.img"
revision = "8b9acafab284a2f0d2ad91cf4c4dac204236e75b"

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**", "dts/vendor/peridot-stock.dts"]
inputs = ["Eight cores with MPIDR 0x000 through 0x700, GIC distributor at 0x17100000, redistributors at 0x17180000 with 0x40000 stride, 19.2 MHz timer and PSCI over SMC."]
configuration = ["dts/peridot.dts includes sm8635.dtsi from the SoC source.", "cpu_regs lists every MPIDR in the ADT; clusters are A520 (E), A720 (P) and X4 (P)."]
procedure = ["Compile the board DTS and inspect enabled CPUs, GIC ranges and timer properties in the ADT.", "Record per-CPU entry, timer interrupts and IPI delivery for each core."]
findings = ["The stock DTS describes every core as qcom,kryo; the dtsi uses the ARM generic compatible strings so the platform expert builds CPU nubs.", "GIC and redistributor ranges match SM8550 exactly, so the SoC dtsi can keep that layout."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer and IPI handling work on each core."]
limits = ["CPU frequency policy is a board input and is not implemented."]
next_action = ["Verify the redistributor count against the GICR_TYPER value on the device."]

[[area.evidence]]
kind = "source"
reference = "dts/vendor/peridot-stock.dts"
result = "CPU MPIDR values, GIC ranges and redistributor stride."

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "dts/vendor/peridot-stock.dts", "board.toml"]
inputs = ["DRAM at 0x80000000, 12 GiB on this unit (ddr_size = 0x0c). UEFI runs inside 0xA7100000 to 0xA7400000; the display reservation is 0xE3940000 with size 0x2B00000."]
configuration = ["device_tree.source = device:dts/peridot.dts with include_dirs = [soc:dts].", "payload.dram_size and payload.adt.owned_memory_size are both 0x380000000; both are flagged for verification against the firmware memory map."]
procedure = ["Compare the firmware memory map, the DTS memory and reserved-memory nodes and the ADT memory-map entries before the first boot.", "Check every DMA range against the controller address width and SMMU mapping before enabling a driver."]
findings = ["The top of DRAM for a 12 GiB device starting at 0x80000000 is 0x380000000; the payload values use that address and still need confirmation.", "apps SMMU sits at 0x15000000, the same address as SM8550."]
completion = ["Every handoff region is accounted for and each DMA engine reaches its range with the documented cache policy."]
limits = ["The RAM size varies by SKU, so both payload values must be re-derived per unit."]
next_action = ["Read the firmware memory map and record it here."]

evidence = []

[[area]]
id = "storage"
    # Implemented and device-tested: the transport, the manifest and the
    # IOStorageFamily hand-off work; the root volume still does not mount.
    status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["board.toml", "feeds.toml", "configs/peridot_defconfig", "drivers/ShengUfs", "dts/vendor/peridot-stock.dts"]
inputs = ["UFS host at 0x1d84000 with size 0x3000, ICE at 0x1d88000, ICE hardware key manager at 0x1d90000, MCQ registers, PHY at 0x1d80000 and the apps SMMU stream 0x60."]
configuration = ["ShengUfs is vendored under drivers/ShengUfs and declared as a local source in feeds.toml, so it can be adapted for cliffs and the build survives an unreachable github.com.", "Its probe() accepts qcom,ufshc in addition to qcom,sm8550-ufshc; the three facts that make that safe (controller base, SMMU stream, GCC base) are in the comment there.", "CONFIG_XNU_NATIVE_UFS is enabled and the kernel links: the storage class imports are bound from the original kernelcache by tools/ufs-bindings.py.", "userdata.first_lba is measured from this phone's GPT (0x253000) and last_lba follows from the measured partition size, so last_lba - first_lba + 1 equals the sector count.", "userdata.windows maps OS to the IPSW OS component and SystemOS to Cryptex1,SystemOS; both members were verified against the selected iPadOS 17.7.11 profile SHA-256 pins."]
procedure = ["Read the GPT and confirm the userdata entry before writing any board value.", "After WSL access is available, run the peridot UFS binding wrapper on the active tree and verify its archive and current kernel.json; then boot with native-ufs-probe=2 and =10 for read-only transport/GPT checks before any write."]
findings = ["The host and PHY addresses match SM8550, but the PHY compatible is qcom,ufs-phy-qmp-v4-cliffs and the controller adds ICE and MCQ regions that the SM8550 implementation does not use.", "ShengUfs keeps GCC and SMMU handling as constants, so reusing it means re-deriving the clock and stream tables for cliffs.", "The transport does not program clocks or the PHY: it checks GCC power state and assumes the bootloader left the link up, which is what fastboot boot gives us.", "The driver compiles and libShengUfs.a builds, but the kernel link fails with three groups of missing symbols: IOBlockStorageDevice (external IOStorageFamily kext), verified_root_key/policies (VerifiedRoot) and boot_progress_poll.", "VirtioBlock and RamBlock resolve the storage class through build/*-bindings.py, which audits refer/IOStorageFamily and binds the imports to the original kext; there is no equivalent script for UFS in UniXNU.", "The peridot workspace has tools/ufs-bindings.py; its WSL wrapper was corrected, but WSL currently returns E_ACCESSDENIED, so the current build-tree archive and kernel.json could not be verified.", "The publish chain stalls after matching: probe=15 registers all four personalities (added=f, cat=4) and the device is in the registry, yet IOBlockStorageDriver has zero instances and there is no IOMedia, so IOMedia-based partition discovery never starts.", "HakiOS avoids IOStorageFamily entirely: hakios.ufs.c publishes one BSD block device per GPT partition through bdevsw_add plus devfs_make_node (lines 1082, 1736, 1750) and APFS mounts from the device node, which is verified working on the POCO X5 Pro.", "shengufs-ref moved to a deferred IOBlockStorageDevice adapter that loads IOStorageFamily and APFS at runtime; its README states the implementation has not been built or run since testing stopped and that class size equality does not prove virtual interface compatibility, so peridot's fork of the older path has no verified successor to copy.", "After the iOS userdata image was flashed, the transport reached the whole chain: the v2 manifest parsed with two windows (0xc4e00000 bytes), IOStorageFamily registered 15 personalities, IOBlockStorageDriver opened the published device (NU8 open NativeUfs) and APFS loaded.", "The IOStorageFamily fork is now closed by evidence: calling IOBlockStorageDevice::start blocks the publisher for 30 s (p84 and p88, start=1, and in p88 the personalities had not even been loaded, cat=0/4), while skipping it lets the window publish (p85, published=1, start=3) but IOBlockStorageDriver then opens the device and fails its own start, leaving inst=0/0 and dev=0,0,0,0,0,0 and never creating an IOMedia. p85 replaced the blocking IOBlockStorageDevice::start call with IOService::start and the publisher now completes: NU6 1/NU6 2 both print, NU4 reports published SystemOS, published=1 and start=3 in the report. The wait loop then runs (waitTicks=26) but IOMedia never appears (media=0, drivers=0) although NU8 shows IOBlockStorageDriver opening the device, so the driver declines to create media after the open. After the PMGR fix the publisher still reports published=0 with waitTicks=0 while the same screen shows NU8 open NativeUfs, so IOBlockStorageDriver did attach; the publish thread simply never returns from the registerService() call in NativeUfsBlock::start. The 10 s publication report is misleading: at that point the publisher is still in the Start phase, so published=0 and waitTicks=0 look like a stall; with native-ufs-report-delay=30 the device is published and opened well before the report fires.", "The peridot copy of the integration (package/ShengPlatformPower.cpp, scripts/build-sheng-platform-power.py, patches/xnu/sheng-platform-power.patch and its series entry) is staged but disabled: the guarded ABI instrument builds against a build/xnu-prelink reference candidate that this flow never emits. The PMGR integration is now built and linked (kernel 6bb95457, sheng-pmgr=2): the AMFI No PMGR panic is gone and the boot reaches NVRAM, AppleImage4 and IOBlockStorageDriver, so the blocked window and the published device no longer wait on AMFI. The next blocker is outside storage: AMFI waits for an ApplePMGRNub and panics with AMFI: No PMGR? at ConfigurationSettings.cpp:235; sheng satisfies it with the sheng-platform-power integration (kits/sheng/ShengPlatformPower.cpp, CONFIG_XNU_SHENG_PMGR, sheng-pmgr), which peridot does not have yet."]
completion = ["SCSI capacity, GPT and known blocks are correct, then the configured root volume mounts and launchd starts."]
limits = ["Read-only only: the driver reads the GPT and one block, and nothing has been written through it."]
next_action = ["Mount the root volume from the bdevsw device: /dev/disk0 now reads the SHNGROOT manifest (magic 53484e47, p93), so wire the APFS mount path to that node instead of an IOMedia UUID.", "Publish the root volume through bdevsw and devfs instead of IOBlockStorageDriver: register a block device switch table, create the disk node, and let APFS reach it through the BSD layer.", "Keep the IOBlockStorageDevice path as a fallback only; it is blocked by behaviour inside a prelinked kext we cannot read.", "Count the IOBlockStorageDevice callbacks (reportBlockSize, reportMaxValidBlock, reportMediaState, getDeviceType) and print them in the report to see which query IOBlockStorageDriver rejects before it publishes media.", "Then confirm the IOMedia UUID wait completes and the root volume mounts.", "Unblock the staged sheng-platform-power integration (done in p83; keep the prelink candidate retention documented): scripts/build-sheng-platform-power.py and audit-amfi-pmgr-contract.py need a build/xnu-prelink reference candidate, which this build flow does not produce yet.", "Then enable CONFIG_XNU_SHENG_PMGR, add build-sheng-platform-power.py to the archives list and pass sheng-pmgr=2.", "Then re-run native-ufs-probe=15 and confirm the IOMedia UUID wait completes and the root volume mounts.", "Keep native-ufs-report-delay at 30: the default 10 s samples the publisher too early."]

evidence = [
  { kind = "host", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "cd /root/work/UniXNU && ./unixnu defconfig peridot_defconfig -D ../UniXNU-peridot && ./unixnu kernel -D ../UniXNU-peridot", revision = "2e767bc7aa14e0dfaec774cfe73d3180fcb74dfd", result = "NativeUfs.cpp builds to a 473 KB object with 634 symbols, libShengUfs.a is produced, and -force_load reaches the kernel link line." },
  { kind = "host", reference = "configs/peridot_defconfig", command = "cd /root/work/UniXNU && UNIXNU_KERNELCACHE=$PWD/out/ipsw/21H461/kernelcache.decompressed ./unixnu kernel -D ../UniXNU-peridot", revision = "2e767bc7aa14e0dfaec774cfe73d3180fcb74dfd", result = "With CONFIG_XNU_NATIVE_UFS=y the link stops on IOBlockStorageDevice (external IOStorageFamily kext), verified_root_key/policies (VerifiedRoot) and boot_progress_poll; the option is back to unset so the tree still builds." },
  { kind = "source", reference = "dts/vendor/peridot-stock.dts", result = "ufshc@1d84000 with reg size 0x3000, iommus <&apps_smmu 0x60 0> and GCC clock-controller@100000: the three constants the SM8550 transport assumes all match." },
  { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-ufsprobe.img with kernel_args -v native-ufs-probe=2", revision = "2e767bc7aa14e0dfaec774cfe73d3180fcb74dfd", result = "The vendored SM8550 transport matched peridot ufshc and ran its read-only inspection on device: the six GCC UFS PHY clock branches (axi, ahb, uniphy, txs, rxs, aux) all read 0x11, so fastboot leaves the link clocked. The gdsc values printed as 0xff22227ff890000, which does not look like a power-domain status register, so the SM8550 GCC offsets are probably wrong for cliffs and must be re-derived before anything is written." },
  { kind = "host", reference = "docs/boot-bisection.md", revision = "02a562d39c4cbd160633d3ab611010a994d54848", command = "python .tmp/build_userdata_image.py --ipsw <local iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw>; python .tmp/verify_userdata_image.py <generated userdata-root.img>", result = "Generated a 9,382,658,048-byte SHNGROOT v1 image with OS and SystemOS windows. Both IPSW members matched the OS profile SHA-256 pins; independent header, bounds, per-window and full-image SHA-256 checks passed. Capacity used the measured 0x78587FB000-byte partition size only; physical first/last GPT LBA remain unset, the image was not flashed, and hardware boot was not tested." },
  { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-p115.img with kernel_args -v native-ufs-probe=17 native-ufs-mountroot=1 peridot-apfs-vfsmount=1", revision = "283feb0deb1ed0c4909ff4e664f0113e3d9acbff", result = "Cross-container reads at offsets 0, 4 MiB, 64 MiB and 1 GiB all returned status 0, so the transport serves the whole window. Both APFS entry points fail: apfs_vfsop_mountroot and a direct VFS_MOUNT gated by peridot-apfs-vfsmount=1 both return ENOENT at apfs_vfsop_mount:2479. Cause: the flashed userdata image is the update payload, not an installed system. Container 4096 x 1483776 (6,077,546,496 bytes) with UUID 50f8a67f-afc1-4aaf-...; volume 04769d26-... named DawnUpdate21H461.J120J121J207J208OS carries no root snapshot (com.apple.os.update absent) and no role, so it cannot serve as a root volume." },
]

[[area]]
id = "display"
status = "planned"
components = []
paths = ["board.toml", "dts/**"]
inputs = ["Framebuffer 1220 by 2712 at 32 bits per pixel, published by UEFI GOP and reserved at 0xE3940000 with size 0x2B00000."]
configuration = ["bootimg.dtb_node adds /reserved-memory/splash_region with label cont_splash_region for the boot image.", "adt.product.string overrides artwork-display-gamut to sRGB for the 8-bit GOP path."]
procedure = ["Confirm the panel is initialised by the bootloader and that GOP reports the expected geometry.", "Select GopFramebuffer once the kernel reaches the display checkpoint."]
findings = ["The stock DTS contains three panel variants (n16t_42_02_0a, n16t_36_0f_0b and n16t_42_0a_0c), but the UniXNU path drives the UEFI framebuffer and does not program the panel.", "The UEFI framebuffer geometry matches the panel resolution, so no scaling step is needed."]
completion = ["A known frame appears with correct geometry and colours, then userland presentation works."]
limits = ["Display depends on the bootloader having already trained the panel; a cold panel start is out of scope for this path."]
next_action = ["Record the reported GOP geometry on the device."]

evidence = []

[[area]]
id = "input"
status = "planned"
components = []
paths = ["dts/vendor/peridot-stock.dts", "board.toml"]
inputs = ["Focaltech N16T-3683G touch controller on SPI, reported by the stock DTS as xiaomi,peridot-spi and focaltech,n16t-3683g-spi. Side buttons are separate GPIO keys."]
configuration = ["adt.buttons declares hold, voldown and volup without a menu button and sets home-button-type = 2 for gesture navigation."]
procedure = ["Read the touch controller identification from the stock firmware to confirm the panel and touch pairing on this unit.", "Implement a SPI transport and a focaltech report decoder, then publish them through the HID input path."]
findings = ["HakiOS does drive FocalTech: its hakios.goodix.c handles both Goodix GT9916 and FocalTech FT3680 with a 116448-byte firmware blob in hakios.focaltech_fw.h, and multitouch works on the POCO X5 Pro (redwood).", "The stock DTS also carries a goodix node, so units may differ in touch supplier.", "The low-risk path stays inside UniXNU: ShengHidInput and QcomGeniSpi are proven on sheng, so only the focaltech report decoder has to be written."]
completion = ["Touch reports reach the HID stack and drive the lock screen and SpringBoard."]
limits = ["No input driver is selected beyond the ADT button declaration."]
next_action = ["Confirm the controller on this unit (focaltech,n16t-3683g-spi), then write the focaltech decoder on top of ShengHidInput and QcomGeniSpi."]

evidence = []

[[area]]
id = "gpu"
status = "implemented"
components = ["Sm8635Platform", "Adreno735", "AdrenoPM4", "AdrenoFirmware", "ArmSmmu4K"]
paths = ["dts/vendor/peridot-stock.dts", "dts/peridot.dts", "drivers/Adreno735/**", "package/sm8635-gpu/**", "scripts/build-adreno735-kits.py", "docs/gpu-bring-up.md"]
inputs = ["Adreno 735, chip id 0x43030b00, gen7-11-0, at 0x3d00000 with GMU at 0x3d68000 and GPU SMMU at 0x3da0000."]
configuration = ["peridot.dts enables the gpu, gmu and gpu_smmu nodes; sm8635.dtsi keeps them disabled for every other board.", "Adreno735 is selected with Sm8635Platform: component:Adreno735 builds build/adreno735/libAdreno735.a, and build-adreno735-kits.py appends the kit and dependency-kit objects to it.", "build-xnu-4k-baseline.sh force-loads the archive, and the Mach-O constructor in NativeAdreno735.cpp runs stage 1-2 before bsd_init because this kernel installs no personality for built-in drivers."]
procedure = ["Confirm the GPU chip id from the stock DT and the palawan catalog before selecting an implementation.", "Verify one stage per boot with a panic marker: the board has no UART, so the screen is the only evidence."]
findings = ["The GPU is a different part from sheng's: chip id 0x43030b00 against 0x43050a01, and the GMU compatible is qcom,gen7-gmu rather than qcom,adreno-gmu-740.1.", "The GPU SMMU and its register window keep the SM8550 addresses.", "The RSCC window is the second range of the kgsl node at 0x3d50000 and the misc block is named cx_misc; SM8550 calls the same block cx_mem.", "scripts/prepare-sm8635-gmu.py derives the five windows, the chip id and the 0x68000 core-to-gpu delta from the compiled DTB, then verifies the pinned v6.16 sources and extracts the 19-write RSC/PDC sequence along the non-A740 branch.", "The non-A740 sequence is distinguishable from sheng's: the sequencer lands at word 0x180 instead of the A740 word 0x154, the TCS value is 0x80000000 instead of 0x80000021, and pdc_in_aop skips the PDC microcode block, leaving only the two setup_pdc writes.", "Upstream v6.16 has no 0x43030b00 entry in a6xx_catalog.c, and msm_kgsl.ko carries neither the chip id nor an Adreno735 string (the model and chip id come from the device tree), so the GMU chip id is derived from the GEN7_x_y encoding used by commit 2c4c53f: 0x070b0000, patch level 0 because qcom,patchid is absent.", "ShengGmuSource.h is now generated: 36 register constants, both fatal masks, the 80680-byte firmware hash and the 19-write non-A740 RSC table.", "The generator now also emits ShengGpuSmmuSource.h (0x3da0000, streams {0,2}, GMU SID 5) and ShengGmuCommandDbSource.h (0x81c60000, 131072 bytes) from the compiled DTB.", "The three kit sources and the Adreno735 skeleton compile against the kernel's own .o.json recipes: objects 47528, 9072, 21712 and 170976 bytes.", "Catalog entries Sm8635Platform and Adreno735 exist and unixnu status resolves with them; feeds.toml vendors drivers/Adreno735 locally like ShengUfs.", "The palawan-mainline kernel carries the A735 catalog entry and confirms the derived gmu_chipid 0x070b0000, the three gen71100 firmware names, gmem of 1.5 MiB, gmu_cgc_mode 0x00020202, family ADRENO_7XX_GEN2 and the SH0/MC0/ACV BCM table; none of these are in the XNU tree yet.", "palawan.dtsi carries the complete GPU wiring: an 11-level OPP table matching the frequencies the device reports, seven GMU clocks, GPU_CC_CX/GX power domains, the GPUCC node at 0x3d90000 and the 26-interrupt ADRENO SMMU. The nodes are saved verbatim in reference/palawan-gpu-nodes.dtsi.", "palawan puts the GMU at 0x3d6a000 with size 0x35000 while peridot's stock node says 0x3d68000 size 0x37000; both end at 0x3d9f000. peridot must keep its own base or every GMU register offset shifts by 0x2000.", "Turnip already describes this part: freedreno_devices.py carries FD735 for chip id 0x43030B00 as a7xx_gen2 with num_ccu 3 and tile_max 2016x2032, matching palawan's ADRENO_7XX_GEN2 family. The userspace Vulkan description therefore exists and the kernel driver is the only blocker.", "A clean boot loads gen71100_zap.mbn from /odm/firmware at 6.87 s and the driver lists gen71100_gmu.bin with gen71100_sqe.fw, so the GMU image is gen71100_gmu.bin (80680 bytes, sha256 435c7bac); gmu_gen70900.bin belongs to the other GPU bin, which /odm/firmware also covers with gen70900_zap.mbn.", "The generator now also emits ShengGpuSmmuSource.h (0x3da0000, streams {0,2}, GMU SID 5) and ShengGmuCommandDbSource.h (0x81c60000, 131072 bytes) from the compiled DTB.", "The three kit sources and the Adreno735 skeleton compile against the kernel's own .o.json recipes: objects 47528, 9072, 21712 and 170976 bytes.", "Catalog entries Sm8635Platform and Adreno735 exist and unixnu status resolves with them; feeds.toml vendors drivers/Adreno735 locally like ShengUfs.", "Adreno735 is now linked: component:Adreno735 builds build/adreno735/libAdreno735.a, build-adreno735-kits.py appends 16 kit and dependency-kit objects, and build-xnu-4k-baseline.sh force-loads the archive, so kernel.macho carries NativeAdreno735 and ShengGmu symbols.", "The board build-arm-driver.py keeps hardcoded component, source, output and include tables, so adding a driver means patching four places there rather than the catalog alone.", "The kit now carries the palawan-derived votes data: eleven GPU OPPs with their RPMH levels and bandwidths, two GMU OPPs, the SH0/MC0/ACV BCM policy, gmem of 1.5 MiB and gmu_cgc_mode 0x00020202, all generated from scripts/data/sm8635-gmu-votes.json.", "Stage 1-2 is device-verified: p66 maps all five GPU windows with ml_io_map and ShengGmuBindMmio returns ShengGmuSuccess, reported as NU735 ctor gpu=1 mapped=5 bind=0 at NativeAdreno735.cpp:92.", "Built-in drivers get no IOKit personality in this kernel, so IOService matching never instantiates them; the working entry point is the Mach-O constructor, which p65 proves runs and can read boot arguments.", "Stage 3 reached the hardware: p68 reports hash=1 with a local SHA-256 because the kernel ccdigest glue is unusable at constructor time, and p69 lands the corrected core offsets at the GMU window plus 0x14000 where the bus returns an external abort.", "GPUCC is readable (p70 reads cx=0x80000000 and gx=0x0) but the sm8650 clock-branch offsets do not respond to writes (p71 reads all five back as 0), so the cliffs register map must come from the vendor source rather than the sibling platform driver.", "The vendor peridot-u-oss gpucc-cliffs.c offsets are correct where the sm8650 ones were not: p72 enables cxo, hub_cx_int, hub_aon and cx_gmu with bit 0 and bit 31 set.", "gpu_cc_ahb_clk only enables after its parent gpu_cc_hub_clk_src RCG at 0x919c is configured, and the vendor GPUCC driver defines no GDSCs at all, so the CX and GX domains are hardware or RPMh controlled; p73 still aborts at GMU window plus 0x14000.", "p74 shows the GPUCC split: the CX branches (cx_gmu 0x90e4, hub_cx_int 0x90f4) read as already enabled while gpu_cc_ahb_clk (0x90c8) and the hub RCG (0x919c, 0x91a0) read zero and ignore writes.", "p75 enables the GCC GPU clocks (qmip 0x80000003, memnoc 0x80000003, snoc 0x20000001) yet gpu_cc_ahb_clk stays zero, so the branch also needs its parent gpu_cc_hub_clk_src configured.", "Diagnostics now print through printf to the framebuffer console: a panic reboots the phone about a minute later and the screen is lost.", "p78 shows the hub RCG programming works: writing 3 to 0x919c leaves bit 1 (ROOT_EN) set while the hardware clears bit 0, so the TCXO-sourced clock source runs.", "p79 then takes an external abort on the GPUCC 0x90c8 access itself, so that sub-block is unpowered; with the vendor GPUCC driver defining no GDSCs, the CX domain has to be powered through RPMh.", "p80 reads the AP RSC at 0x17a00000 and takes an external abort on the DRV_ID register itself, so the RSC block is not powered in this boot path.", "Linux only reaches that block because the XBL and AOP handshake leaves it available; a UEFI to fastboot-boot to XNU start never performs it, so an RPMh voter cannot even open its mailbox yet.", "The Mu-Silicium tree carries no RPMh, AOP or GDSC code under Silicon/Qualcomm, so a firmware-side CX vote would be new firmware work rather than a configuration change."]
completion = ["A GPU provider matches the ADT node and renders a frame."]
limits = ["Only the window map and the kit bind are verified; no GMU register has been read or written, and the firmware stage still needs memory allocated before bsd_init."]
next_action = ["Establish a boot path in which the AP RSC answers before writing any voter: either a firmware-side vote or a vendor power framework port.", "Park stage 3 until CX can be voted; the GMU code is ready behind the power gate.", "Keep the GPU record evidence current so the next session starts from the RSC finding rather than the GPUCC one."]

